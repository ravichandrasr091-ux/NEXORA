name: Build Android APK and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK and prepare website
        run: |
          unzip -q RagiIncubatorAndroid-source.zip -d android-source
          project_dir="$(find android-source -name settings.gradle.kts -print -quit | xargs dirname)"
          test -f "$project_dir/app/build.gradle.kts"
          gradle --no-daemon -p "$project_dir" assembleDebug
          mkdir -p site/downloads
          cp "$project_dir/app/build/outputs/apk/debug/app-debug.apk" site/downloads/ragi-incubator.apk
          cp index.html site/index.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
