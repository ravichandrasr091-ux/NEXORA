name: Deploy NEXORA website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test BLE protocol
        run: node --test website/ble-protocol.test.js

      - name: Prepare website and preserved APK downloads
        run: |
          test -s website/ble-protocol.js
          test -s website/downloads/nexora-android-v2.0.apk
          test -s website/downloads/nexora-android-v3.0.apk
          test -s website/downloads/nexora-android-v3.1.apk
          test -s website/downloads/nexora-android-v3.1.1.apk
          test -s website/downloads/nexora-android-v3.2.apk
          mkdir -p site/downloads
          cp website/index.html website/styles.css website/ble-protocol.js website/app.js website/manifest.webmanifest website/sw.js website/nexora-icon-192.png website/nexora-icon-512.png site/
          cp website/downloads/nexora-android-v2.0.apk website/downloads/nexora-android-v3.0.apk website/downloads/nexora-android-v3.1.apk website/downloads/nexora-android-v3.1.1.apk website/downloads/nexora-android-v3.2.apk site/downloads/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
